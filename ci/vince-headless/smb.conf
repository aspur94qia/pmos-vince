[global]
   workgroup = WORKGROUP
   server string = Vince
   server role = standalone server
   security = user
   map to guest = never
   passdb backend = tdbsam
   server min protocol = SMB2
   load printers = no
   disable spoolss = yes
   printcap name = /dev/null
   log file = /var/log/samba/log.%m
   max log size = 500

[share]
   path = /home/user/share
   read only = no
   valid users = user
   create mask = 0664
   directory mask = 0775

[downloads]
   path = /home/user/downloads
   read only = no
   valid users = user
   create mask = 0664
   directory mask = 0775
